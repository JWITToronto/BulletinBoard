<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="jquery-3.1.0.min.js"></script>
    <script src="bootstrap.min.js"></script>
    <script src="angular.min.js"></script>
    <style>
        h1 {
            font-size: 950%;
        }
        #batch {
            color: orangered;
            text-align: left;
        }
        #colHeadOne {
            color: black;
            text-align: left;
        }
        #colHeadTwo {
            color: black;
            text-align: right;
        }
        #bluecolor {
            color: blue;
            text-align: left;
        }
        #blackcolor {
            color: black;
            text-align: left;
        }
        #noOrders {
            color: red;
            text-align: left;
        }
        th {
            font-size: 500%;
            font-weight: bold;
        }
        td {
            font-size: 300%;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <br><br><br>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th id="colHeadOne">BATCH</th>
                        <th id="colHeadOne">BEFORE 11AM</th>
                        <th id="colHeadTwo">AFTER 11AM</th>
                    </tr>
                    <tr>
                        <td id="batch">R-BATCH</td>
                        <td style="color: orangered; text-align: center;" id="rBatchDate_Yesterday"></td>
                        <td style="color: orangered; text-align: center;" id="rBatchDate"></td>
                    </tr>
                    <tr>
                        <td id="bluecolor">HAS + RE/RE</td>
                        <td style="color: blue; text-align: center;" id="hasrebatch_Yesterday"></td>
                        <td style="color: blue; text-align: center;" id="hasrebatch"></td>
                    </tr>
                    <tr>
                        <td id="bluecolor">HIP + BATCH</td>
                        <td style="color: blue; text-align: center;" id="hipbatch_Yesterday"></td>
                        <td style="color: blue; text-align: center;" id="hipbatch"></td>
                    </tr>
                    <tr>
                        <td id="blackcolor">HOUSE LOTS</td>
                        <td style="color: black; text-align: center;" colspan="2" id="houseLots"></td>
                    </tr>
                    <tr>
                        <td id="noOrders">NO ORDERS</td>
                        <td style="color: red; text-align: center;" colspan="2" id="noOrdersDate"></td>
                    </tr>
                    <tr>
                        <td id="noOrders">SERVICE R-BATCH</td>
                        <td style="color: red; text-align: center;" colspan="2" id="ServiceRBatchDate"></td>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
<script>
    let holidays = [
        new Date("January 1, 2026"), new Date("January 2, 2026"),  new Date("February 16, 2025"),new Date("April 3, 2026"), new Date("March 26, 2026"), new Date("March 27, 2026"),
        new Date("May 18, 2026"), new Date("June 25, 2026"), new Date("June 26, 2026"), new Date("July 1, 2026"), new Date("August 3, 2026"), new Date("September 7, 2026"), new Date("September 24, 2026"),
        new Date("September 25, 2026"), new Date("October 12, 2026"), new Date("December 22, 2026"), new Date("December 23, 2026"), new Date("December 24, 2026"), new Date("December 25, 2026")
    ];

    function formatDateToronto(date) {
        return new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Toronto',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        }).format(date);
    }

    function isHoliday(date) {
        return holidays.some(h => h.toDateString() === date.toDateString());
    }

    function addBusinessDays(days) {
        let currentDate = new Date();
        let addedDays = 0;
        while (addedDays < days) {
            currentDate.setDate(currentDate.getDate() + 1);
            if (currentDate.getDay() !== 0 && currentDate.getDay() !== 6 && !isHoliday(currentDate)) {
                addedDays++;
            }
        }
        return currentDate;
    }

    function noOrdersDate() {
        let today = new Date();
        for (let i = 0; i < holidays.length; i++) {
            if (holidays[i] > today) {
                return holidays[i];
            }
        }
        return null;
    }

    let rBatchDate = addBusinessDays(5);
    let rBatchDate_Yesterday = addBusinessDays(4);
    let HasReBatchDate = addBusinessDays(9);
    let HasReBatchDate_Yesterday = addBusinessDays(8);
    let HipBatchDate = addBusinessDays(8);
    let HipBatchDate_Yesterday = addBusinessDays(7);
    let NextNoOrderDate = noOrdersDate();
    let ServiceRBatchDate = addBusinessDays(6);

    document.getElementById('rBatchDate').innerText = formatDateToronto(rBatchDate);
    document.getElementById('rBatchDate_Yesterday').innerText = formatDateToronto(rBatchDate_Yesterday);
    document.getElementById('hasrebatch').innerText = formatDateToronto(HasReBatchDate);
    document.getElementById('hasrebatch_Yesterday').innerText = formatDateToronto(HasReBatchDate_Yesterday);
    document.getElementById('hipbatch').innerText = formatDateToronto(HipBatchDate);
    document.getElementById('hipbatch_Yesterday').innerText = formatDateToronto(HipBatchDate_Yesterday);
    document.getElementById('houseLots').innerText = "4 W.L.T";
    document.getElementById('noOrdersDate').innerText = formatDateToronto(NextNoOrderDate);
    document.getElementById('ServiceRBatchDate').innerText = formatDateToronto(ServiceRBatchDate);
</script>
</body>
</html>
