<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="jquery-3.1.0.min.js"></script>
    <script src="bootstrap.min.js"></script>
    <script src="angular.min.js"></script>
    <style>
        h1{
        font-size: 950%;
        
    }
    #batch{
        color: orangered;
        text-align: left;
    }
    #colHeadOne{
        color: black;
        text-align: left;
    }
	#colHeadTwo{
        color: black;
        text-align: right;
    }
    #bluecolor{
        color: blue;
        text-align: left;
    }
    #blackcolor{
        color: black;
        text-align: left;
    }
    #noOrders{
        color: red;
        text-align: left;
    }

    th{
        font-size: 500%;
        font-weight: bold;

    }
	td{
        font-size: 300%;
        font-weight: bold;

    }
	
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <br><br><br>
                <table class="table table-bordered">
                    <thead>
					    <tr>
						    <th id="colHeadOne">BATCH</th>
                            <th id="colHeadOne">BEFORE 11AM</th>
                            <th id="colHeadTwo">AFTER 11AM</th>
                        </tr>
                        <tr>
                            <td id="batch">R-BATCH</td>
							<td style="color: orangered; text-align: center;" id="rBatchDate_Yesterday"></td>
                            <td style="color: orangered; text-align: center;" id="rBatchDate"></td>						    
                        </tr>
                        <tr>
                            <td id="bluecolor">HAS + RE/RE</td>
							<td style="color: blue; text-align: center;" id="hasrebatch_Yesterday"></td>
							<td style="color: blue; text-align: center;" id="hasrebatch"></td>
                        </tr>
                        <tr>
                            <td id="bluecolor">HIP + BATCH</td>
							<td style="color: blue; text-align: center;" id="hipbatch_Yesterday"></td>
							<td style="color: blue; text-align: center;" id="hipbatch"></td>
                           
                        </tr>
                        <tr>
                            <td id="blackcolor">HOUSE LOTS</td>
							<td style="color: black; text-align: center;" colspan="2" id="houseLots"></td>
                        </tr>
                        <tr>
                            <td id="noOrders">NO ORDERS</td>
							<td style="color: red; text-align: center;" colspan="2" id="noOrdersDate"></td>   
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
    <script>
 
		    let holidays = [
				new Date("January 1, 2025"), new Date("February 17, 2025"), new Date("March 27, 2025"), new Date("March 28, 2025"),
				new Date("April 18, 2025"), new Date("May 19, 2025"), new Date("June 26, 2025"), new Date("June 27, 2025"),
				new Date("July 1, 2025"), new Date("September 1, 2025"), new Date("September 25, 2025"), new Date("September 26, 2025"),
				new Date("October 13, 2025"), new Date("December 18, 2025"), new Date("December 19, 2025"), new Date("December 25, 2025"),
				new Date("December 26, 2025")
			];
		    	
		    let days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            let months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            let rBatchDate  = addBusinessDays(6);
			let rBatchDate_Yesterday  = addBusinessDays(5);
			
		    let HasReBatchDate  = addBusinessDays(10);
			let HasReBatchDate_Yesterday  = addBusinessDays(9);
			
			let HipBatchDate  = addBusinessDays(9);
			let HipBatchDate_Yesterday = addBusinessDays(8);
			
			let NextNoOrderDate = noOrdersDate();
		    let NextNoOrderDate_Yesterday = noOrdersDate();
		    
            document.getElementById('rBatchDate').innerText = months[rBatchDate.getMonth()] + " " + rBatchDate.getDate() + ", " + rBatchDate.getFullYear();
			document.getElementById('rBatchDate_Yesterday').innerText = months[rBatchDate_Yesterday.getMonth()] + " " + rBatchDate_Yesterday.getDate() + ", " + rBatchDate_Yesterday.getFullYear();
			
			document.getElementById('hasrebatch').innerText = months[HasReBatchDate.getMonth()] + " " + HasReBatchDate.getDate() + ", " + HasReBatchDate.getFullYear();
			document.getElementById('hasrebatch_Yesterday').innerText = months[HasReBatchDate_Yesterday.getMonth()] + " " + HasReBatchDate_Yesterday.getDate() + ", " + HasReBatchDate_Yesterday.getFullYear();
			
			document.getElementById('hipbatch').innerText = months[HipBatchDate.getMonth()] + " " + HipBatchDate.getDate() + ", " + HipBatchDate.getFullYear();
			document.getElementById('hipbatch_Yesterday').innerText = months[HipBatchDate_Yesterday.getMonth()] + " " + HipBatchDate_Yesterday.getDate() + ", " + HipBatchDate_Yesterday.getFullYear();
			
            document.getElementById('houseLots').innerText = "4 W.L.T";
			
			document.getElementById('noOrdersDate').innerText = months[NextNoOrderDate.getMonth()] + " " + NextNoOrderDate.getDate() + ", " + NextNoOrderDate.getFullYear();
		
			function addBusinessDays(days)
			{
				let currentDate = new Date();

			    function isHoliday(date) 
				{
					let dateString = date.toLocaleDateString('en-GB'); // Format date as 'DD/MM/YY'
					return holidays.includes(dateString);
                }

				for (let i = 0; i < days; i++) 
				{
					do 
					{
						currentDate.setDate(currentDate.getDate() + 1);
					} while (currentDate.getDay() === 0 || currentDate.getDay() === 6 || isHoliday(currentDate));
				}

				return currentDate;
            }
			function noOrdersDate() 
			{
				let today = new Date();
                let arrayList = []; 
				
				for (let i = 0; i < holidays.length; i++)
				{
						if (holidays[i] > today) 
						{
							arrayList.push(holidays[i]);
						}
				}
				return arrayList[0];
           }
			
    </script>
</body>
</html>
