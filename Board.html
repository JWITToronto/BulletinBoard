<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="bootstrap.min.css">
    <script src="jquery-3.1.0.min.js"></script>
    <script src="bootstrap.min.js"></script>
    <script src="angular.min.js"></script>
    <style>
        h1{
        font-size: 950%;
        
    }
    #batch{
        color: orangered;
        text-align: left;
    }
    #bluecolor{
        color: blue;
        text-align: left;
    }
    #blackcolor{
        color: black;
        text-align: left;
    }
    #noOrders{
        color: red;
        text-align: left;
    }

    th{
        font-size: 700%;
        font-weight: bold;

    }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <br><br><br>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th id="batch">R-BATCH</th>
                            <th style="color: orangered; text-align: right;" id="rBatchDate"></th>
                        </tr>
                        <tr>
                            <th id="bluecolor">HAS + RE/RE</th>
                            <th style="color: blue; text-align: right;" id="hasrebatch"></th>
                        </tr>
                        <tr>
                            <th id="bluecolor">HIP + BATCH</th>
                            <th style="color: blue; text-align: right;" id="hipbatch"></th>
                        </tr>
                        <tr>
                            <th id="blackcolor">HOUSE LOTS</th>
                            <th style="color: black; text-align: right;" id="houseLots"></th>
                        </tr>
                        <tr>
                            <th id="noOrders">NO ORDERS</th>
                            <th style="color: red; text-align: right;" id="noOrdersDate"></th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
    </div>
    <script>
 
		    let holidays = [
				new Date("January 1, 2025"), new Date("February 17, 2025"), new Date("March 27, 2025"), new Date("March 28, 2025"),
				new Date("April 18, 2025"), new Date("May 19, 2025"), new Date("June 26, 2025"), new Date("June 27, 2025"),
				new Date("July 1, 2025"), new Date("September 1, 2025"), new Date("September 25, 2025"), new Date("September 26, 2025"),
				new Date("October 13, 2025"), new Date("December 18, 2025"), new Date("December 19, 2025"), new Date("December 25, 2025"),
				new Date("December 26, 2025")
			];
		    	
		    let days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            let months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            let rBatchDate  = addBusinessDays(5);
		    let HasReBatchDate  = addBusinessDays(9);
			let HipBatchDate  = addBusinessDays(8);
			let NextNoOrderDate = noOrdersDate();
		
            document.getElementById('rBatchDate').innerText = months[rBatchDate.getMonth()] + " " + rBatchDate.getDate() + ", " + rBatchDate.getFullYear();
			document.getElementById('hasrebatch').innerText = months[HasReBatchDate.getMonth()] + " " + HasReBatchDate.getDate() + ", " + HasReBatchDate.getFullYear();
			document.getElementById('hipbatch').innerText = months[HipBatchDate.getMonth()] + " " + HipBatchDate.getDate() + ", " + HipBatchDate.getFullYear();
            document.getElementById('houseLots').innerText = "4 W.L.T";
			document.getElementById('noOrdersDate').innerText = months[NextNoOrderDate.getMonth()] + " " + NextNoOrderDate.getDate() + ", " + NextNoOrderDate.getFullYear();
		
			function addBusinessDays(days)
			{
				let currentDate = new Date();

			    function isHoliday(date) 
				{
					let dateString = date.toLocaleDateString('en-GB'); // Format date as 'DD/MM/YY'
					return holidays.includes(dateString);
                }

				for (let i = 0; i < days; i++) 
				{
					do 
					{
						currentDate.setDate(currentDate.getDate() + 1);
					} while (currentDate.getDay() === 0 || currentDate.getDay() === 6 || isHoliday(currentDate));
				}

				return currentDate;
            }
			function noOrdersDate() 
			{
				let today = new Date();
                let arrayList = []; 
				
				for (let i = 0; i < holidays.length; i++)
				{
						if (holidays[i] > today) 
						{
							arrayList.push(holidays[i]);
						}
				}
				return arrayList[0];
           }
			
      
 
        function reloadAt11AM() {
            const now = new Date();
            const day = now.getDay(); // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
            const hours = now.getHours();
            const minutes = now.getMinutes();

            // Check if it's Monday to Friday and 11 AM
            if (day >= 1 && day <= 5 && hours === 11 && minutes === 0) {
                location.reload();
            }
        }

        // Check every minute
        setInterval(reloadAt11AM, 60000);
    </script>
</body>
</html>
